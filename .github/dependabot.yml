version: 2
updates:
  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels: ["dependencies"]
    allow:
      - dependency-type: "all"
    ignore:
      # @types/node tracks the lowest supported Node major (engines >=22).
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      mcp:
        patterns:
          - "@modelcontextprotocol/*"
      typescript-tooling:
        patterns:
          - "typescript"
          - "@biomejs/*"
          - "@types/*"
      runtime:
        patterns:
          - "axios"
          - "dotenv"
          - "express"
          - "ipaddr.js"
          - "zod"
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    cooldown:
      default-days: 14

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels: ["dependencies", "ci"]
    groups:
      actions-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    cooldown:
      default-days: 14

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    labels: ["dependencies", "docker"]
    cooldown:
      default-days: 14

  - package-ecosystem: "docker"
    directory: "/deploy"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    labels: ["dependencies", "docker"]
    cooldown:
      default-days: 14

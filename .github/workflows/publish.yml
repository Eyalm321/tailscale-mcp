name: Publish

on:
  release:
    types: [published]
  # Re-publish the current version to npm only (e.g. after an npm-side failure).
  workflow_dispatch:

permissions:
  contents: read

env:
  BUN_VERSION: "1.3.13"
  TAILSCALE_VERSION: "1.96.4"

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun run typecheck
      - name: Lint
        run: bun run lint
      - name: Install Tailscale CLI
        run: |
          . /etc/os-release
          curl -fsSL "https://pkgs.tailscale.com/stable/${ID}/${VERSION_CODENAME}.noarmor.gpg" | sudo tee /usr/share/keyrings/tailscale-archive-keyring.gpg >/dev/null
          curl -fsSL "https://pkgs.tailscale.com/stable/${ID}/${VERSION_CODENAME}.tailscale-keyring.list" | sudo tee /etc/apt/sources.list.d/tailscale.list
          sudo apt-get update
          sudo apt-get install -y "tailscale=${TAILSCALE_VERSION}"
          tailscale version
      - name: Test
        run: bun test
      - name: Build
        run: bun run build
      - name: Verify build artifacts
        run: test -f dist/index.js

  publish-github:
    needs: test-and-build
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com
      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Build
        run: bun run build
      - name: Publish to GitHub Packages (scoped)
        run: |
          jq '.name = "@eyalm321/tailscale-mcp-server" | .publishConfig.registry = "https://npm.pkg.github.com"' package.json > package-gh.json
          mv package-gh.json package.json
          npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # npm trusted publishing (OIDC): no NPM_TOKEN to expire. Needs the trusted publisher set on npmjs.com
  # (package tailscale-mcp-server -> Settings -> Trusted publisher: GitHub Actions, Eyalm321/tailscale-mcp, workflow publish.yml)
  # and npm 11.5.1+, which Node 24 ships. Bun installs and builds; only the publish uses the npm CLI.
  publish-npm:
    needs: test-and-build
    # A manual run publishes only from main, never from another branch.
    if: github.event_name == 'release' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Use Node.js 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Check npm supports trusted publishing (11.5.1+)
        run: node -e 'const [a,b,c]=process.argv[1].split(".").map(Number);if(a<11||(a===11&&(b<5||(b===5&&c<1)))){console.error("npm "+process.argv[1]+" too old");process.exit(1)}' "$(npm --version)"
      # No dependency install scripts while this job can mint the npm OIDC token.
      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Build
        run: bun run build
      - name: Publish to npm (unscoped)
        run: |
          jq '.name = "tailscale-mcp-server" | del(.publishConfig)' package.json > package-npm.json
          mv package-npm.json package.json
          npm publish --access public
